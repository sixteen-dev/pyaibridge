[package]
name = "pyaibridge-core"
version = "0.3.0"
edition = "2021"
description = "High-performance unified API for all LLM providers - Rust core"
license = "MIT"
repository = "https://github.com/sixteen-dev/pyaibridge"
homepage = "https://github.com/sixteen-dev/pyaibridge"

[lib]
name = "pyaibridge_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }
pythonize = "0.20"
futures-util = "0.3"