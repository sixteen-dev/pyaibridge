name: CI/CD Pipeline

on:
  push:
    branches: [ main, test-pypi ]
  pull_request:
    branches: [ main, test-pypi ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly security scan

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Merge pull request')
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: uv sync --all-extras --dev
    
    - name: Run package tests
      run: uv run python scripts/test_package.py
    
    - name: Run pytest
      run: uv run pytest tests/ -v --tb=short
    
    - name: Run security checks
      run: |
        uv run bandit -r src/ --severity-level medium
        uv run safety scan || true
        uv run pip-audit || true
    
    - name: Run code quality checks
      run: |
        uv run ruff check src/
        uv run mypy src/

  deploy-test-pypi:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/test-pypi' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    needs: test
    environment: test-pypi
    permissions:
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}
    - name: Install dependencies
      run: uv sync --dev
    - name: Build package
      run: uv build
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        verbose: true
    - name: Test installation
      run: |
        sleep 60
        pip install -i https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ pyaibridge
        python -c "import pyaibridge; print(f'✅ TestPyPI deployment successful: v{pyaibridge.__version__}')"

  deploy-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    needs: test
    environment: pypi
    permissions:
      id-token: write
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}
    - name: Install dependencies
      run: uv sync --dev
    - name: Build package
      run: uv build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true
        attestations: true
    - name: Get version and create release
      id: version
      run: |
        VERSION=$(uv run python -c "import sys; sys.path.insert(0, 'src'); from pyaibridge import __version__; print(__version__)")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "v$VERSION" -m "Release $VERSION"
        git push origin "v$VERSION"
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        generate_release_notes: true
        make_latest: true
    - name: Sync wiki
      uses: Andrew-Chen-Wang/github-wiki-action@v4
      with:
        path: wiki/

